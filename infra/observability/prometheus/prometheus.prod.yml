# Prod Prometheus config (docs/sprint/SPRINT-12-PRD.md criterion 7).
# All five app services are containerized in infra/compose/compose.prod.yaml
# and are scraped by their Compose service name.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/recording_rules.yml
  - /etc/prometheus/rules/alert_rules.yml

scrape_configs:
  - job_name: control-plane
    static_configs:
      - targets: ["control-plane:9091"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9092"]

  - job_name: collector
    static_configs:
      - targets: ["collector:9093"]

  - job_name: agent-trace-processor-clickhouse
    static_configs:
      - targets: ["agent-trace-processor-clickhouse:9096"]

  - job_name: fetcher
    static_configs:
      - targets: ["fetcher:9094"]

  - job_name: document-renderer
    static_configs:
      - targets: ["document-renderer:9095"]
