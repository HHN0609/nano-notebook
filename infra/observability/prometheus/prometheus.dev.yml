# Dev Prometheus config (docs/sprint/SPRINT-12-PRD.md criterion 7).
# control-plane, worker, and collector run as host processes in
# dev (scripts/start runs them with `go run`), not containers, so they are
# scraped via host.docker.internal; document-renderer is the one app service
# that IS a container in infra/compose/compose.yaml and is scraped by
# service name.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/recording_rules.yml
  - /etc/prometheus/rules/alert_rules.yml

scrape_configs:
  - job_name: control-plane
    static_configs:
      - targets: ["host.docker.internal:9091"]

  - job_name: worker
    static_configs:
      - targets: ["host.docker.internal:9092"]

  - job_name: collector
    static_configs:
      - targets: ["host.docker.internal:9093"]

  - job_name: agent-trace-processor-clickhouse
    static_configs:
      - targets: ["agent-trace-processor-clickhouse:9096"]

  - job_name: agent-trace-processor-postgres
    static_configs:
      - targets: ["agent-trace-processor-postgres:9096"]

  - job_name: document-renderer
    static_configs:
      - targets: ["document-renderer:9095"]
