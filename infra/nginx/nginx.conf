server {
    listen 80;
    server_name _;

    # Docker DNS resolver — enables dynamic re-resolution on container restarts
    resolver 127.0.0.11 valid=10s;

    # SPA static files
    root /usr/share/nginx/html;
    index index.html;

    # SSE endpoints — disable buffering so events stream in real time
    location ~ ^/(api/v1/agent-runs/.*/events|api/v1/studio-outputs/.*/events) {
        set $backend control-plane:8080;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # API and health checks — proxy to control-plane
    location /api/ {
        set $backend control-plane:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $backend control-plane:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location /version {
        set $backend control-plane:8080;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    # SPA fallback — everything else goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
