services:
  nginx:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-nginx:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - control-plane
    restart: unless-stopped

  control-plane:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-control-plane:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: true
    environment:
      NANO_CONTROL_PLANE_ADDR: ":8080"
      NANO_DATABASE_URL: postgres://nano:nano@postgres:5432/nano?sslmode=disable
      NANO_WORKER_URL: http://worker:8081
      NANO_FETCHER_URL: http://fetcher:8083
      NANO_DOCUMENT_RENDERER_URL: http://document-renderer:8084
      NANO_WEB_BASE_URL: http://localhost
      NANO_BIFROST_URL: http://bifrost:56666
      NANO_QDRANT_COLLECTION: nano-source-evidence-gemini-2-768-v1
      NANO_QDRANT_DENSE_DIMENSIONS: "768"
      NANO_QDRANT_URL: http://qdrant:6333
      NANO_SOURCE_S3_ENDPOINT: minio:9000
      NANO_SOURCE_S3_ACCESS_KEY_ID: nano
      NANO_SOURCE_S3_SECRET_ACCESS_KEY: nano-password
      NANO_SOURCE_S3_BUCKET: nano-sources
      NANO_SOURCE_S3_USE_TLS: "false"
      NANO_MAIL_SMTP_ADDR: mailpit:1025
      NANO_MAIL_FROM: nano@notebook.local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-worker:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: true
    environment:
      NANO_WORKER_ADDR: ":8081"
      NANO_DATABASE_URL: postgres://nano:nano@postgres:5432/nano?sslmode=disable
      NANO_CONTROL_PLANE_URL: http://control-plane:8080
      NANO_FETCHER_URL: http://fetcher:8083
      NANO_DOCUMENT_RENDERER_URL: http://document-renderer:8084
      NANO_BIFROST_URL: http://bifrost:56666
      NANO_SOURCE_S3_ENDPOINT: minio:9000
      NANO_SOURCE_S3_ACCESS_KEY_ID: nano
      NANO_SOURCE_S3_SECRET_ACCESS_KEY: nano-password
      NANO_SOURCE_S3_BUCKET: nano-sources
      NANO_SOURCE_S3_USE_TLS: "false"
      NANO_QDRANT_COLLECTION: nano-source-evidence-gemini-2-768-v1
      NANO_QDRANT_DENSE_DIMENSIONS: "768"
      NANO_QDRANT_URL: http://qdrant:6333
      NANO_COLLECTOR_ENDPOINT: http://collector:8082
      NANO_COLLECTOR_SERVICE_TOKEN: nano-prod-collector-token
      NANO_REPLAY_STAGING_S3_ENDPOINT: minio:9000
      NANO_REPLAY_STAGING_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_STAGING_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_STAGING_S3_BUCKET: nano-agent-replay-staging
      NANO_REPLAY_S3_ENDPOINT: minio:9000
      NANO_REPLAY_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_S3_BUCKET: nano-agent-replay
      NANO_REPLAY_KEY_ID: nano-prod-replay-key-v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  fetcher:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-fetcher:${IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: true
    environment:
      NANO_FETCHER_ADDR: ":8083"
      NANO_FETCHER_DATABASE_URL: postgres://nano:nano@postgres:5432/nano?sslmode=disable
      NANO_FETCHER_SERVICE_TOKEN: nano-prod-fetcher-token
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  collector:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-collector:${IMAGE_TAG:-latest}
    environment:
      NANO_COLLECTOR_ADDR: ":8082"
      NANO_COLLECTOR_DATABASE_URL: postgres://nano_observability:nano-observability@observability-postgres:5432/nano_observability?sslmode=disable
      NANO_COLLECTOR_SERVICE_TOKEN: nano-prod-collector-token
      NANO_COLLECTOR_QUERY_TOKEN: nano-prod-collector-query-token
      NANO_COLLECTOR_DATABASE_MAX_CONNS: "16"
      NANO_COLLECTOR_PROJECTION_DATABASE_MAX_CONNS: "4"
      NANO_COLLECTOR_QUERY_DATABASE_MAX_CONNS: "8"
      NANO_COLLECTOR_PRODUCER_ID: nano-worker
      NANO_REPLAY_STAGING_S3_ENDPOINT: minio:9000
      NANO_REPLAY_STAGING_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_STAGING_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_STAGING_S3_BUCKET: nano-agent-replay-staging
      NANO_REPLAY_S3_ENDPOINT: minio:9000
      NANO_REPLAY_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_S3_BUCKET: nano-agent-replay
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      observability-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  document-renderer:
    image: ${ECR_REGISTRY:-localhost}/nano-notebook-document-renderer:${IMAGE_TAG:-latest}
    environment:
      NANO_DOCUMENT_RENDERER_ADDR: ":8084"
      NANO_DOCUMENT_RENDERER_SERVICE_TOKEN: nano-prod-renderer-token
      NANO_DOCUMENT_RENDER_CONFIG_ID: pdfium-libreoffice-v1
      NANO_DOCUMENT_RENDERER_MAX_CONCURRENT: "2"
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1536m
    cpus: 2.0
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nano
      POSTGRES_PASSWORD: nano
      POSTGRES_DB: nano
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nano -d nano"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  observability-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nano_observability
      POSTGRES_PASSWORD: nano-observability
      POSTGRES_DB: nano_observability
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nano_observability -d nano_observability"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - observability-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nano
      MINIO_ROOT_PASSWORD: nano-password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 nano nano-password
        mc mb --ignore-existing local/nano-agent-replay-staging
        mc mb --ignore-existing local/nano-agent-replay
        mc mb --ignore-existing local/nano-sources

  qdrant:
    image: qdrant/qdrant:v1.15.1
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  bifrost:
    image: maximhq/bifrost:v1.6.3
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "56666"
      LOG_LEVEL: info
      LOG_STYLE: json
    volumes:
      - ../bifrost:/app/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: unless-stopped

volumes:
  postgres-data:
  observability-postgres-data:
  minio-data:
  qdrant-data:
