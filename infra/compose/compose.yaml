services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nano
      POSTGRES_PASSWORD: nano
      POSTGRES_DB: nano
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nano -d nano"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  observability-postgres:
    image: postgres:16-alpine
    profiles: ["postgres-trace-rollback"]
    environment:
      POSTGRES_USER: nano_observability
      POSTGRES_PASSWORD: nano-observability
      POSTGRES_DB: nano_observability
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nano_observability -d nano_observability"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - observability-postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "127.0.0.1:59092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/nano/init-topics.sh"]
    volumes:
      - ../kafka/init-topics.sh:/opt/nano/init-topics.sh:ro

  clickhouse:
    image: clickhouse:26.3.17.56-jammy
    environment:
      CLICKHOUSE_DB: nano_observability
      CLICKHOUSE_USER: nano_observability
      CLICKHOUSE_PASSWORD: nano-observability
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:58123:8123"
      - "127.0.0.1:59004:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host 127.0.0.1 --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30

  agent-trace-processor-postgres:
    build:
      context: ../..
      dockerfile: infra/agent-trace-processor/Dockerfile
    profiles: ["postgres-trace-rollback"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      observability-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NANO_AGENT_TRACE_PROCESSOR_STORE: postgres
      NANO_AGENT_TRACE_PROCESSOR_DATABASE_URL: postgres://nano_observability:nano-observability@observability-postgres:5432/nano_observability?sslmode=disable
      NANO_KAFKA_BROKERS: kafka:19092
      NANO_AGENT_TRACE_PROCESSOR_GROUP_ID: nano-agent-trace-storage-postgres-v1
      NANO_REPLAY_STAGING_S3_ENDPOINT: minio:9000
      NANO_REPLAY_STAGING_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_STAGING_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_STAGING_S3_BUCKET: nano-agent-replay-staging
      NANO_REPLAY_S3_ENDPOINT: minio:9000
      NANO_REPLAY_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_S3_BUCKET: nano-agent-replay

  agent-trace-processor-clickhouse:
    build:
      context: ../..
      dockerfile: infra/agent-trace-processor/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NANO_AGENT_TRACE_PROCESSOR_STORE: clickhouse
      NANO_CLICKHOUSE_ADDR: clickhouse:9000
      NANO_CLICKHOUSE_DATABASE: nano_observability
      NANO_CLICKHOUSE_USER: nano_observability
      NANO_CLICKHOUSE_PASSWORD: nano-observability
      NANO_KAFKA_BROKERS: kafka:19092
      NANO_AGENT_TRACE_TOPIC: nano.observability.agent-trace.v1
      NANO_AGENT_TRACE_PURGE_TOPIC: nano.observability.agent-trace-purge.v1
      NANO_AGENT_TRACE_PROCESSOR_GROUP_ID: nano-agent-trace-storage-clickhouse-v1
      NANO_REPLAY_STAGING_S3_ENDPOINT: minio:9000
      NANO_REPLAY_STAGING_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_STAGING_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_STAGING_S3_BUCKET: nano-agent-replay-staging
      NANO_REPLAY_S3_ENDPOINT: minio:9000
      NANO_REPLAY_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_S3_BUCKET: nano-agent-replay
    ports:
      - "127.0.0.1:59096:9096"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9096/metrics >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  collector:
    build:
      context: ../..
      dockerfile: infra/collector/Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NANO_COLLECTOR_ADDR: ":8082"
      NANO_COLLECTOR_STORE: clickhouse
      NANO_COLLECTOR_SERVICE_TOKEN: nano-local-collector-token
      NANO_COLLECTOR_QUERY_TOKEN: nano-local-collector-query-token
      NANO_COLLECTOR_DATABASE_MAX_CONNS: "16"
      NANO_COLLECTOR_PROJECTION_DATABASE_MAX_CONNS: "4"
      NANO_COLLECTOR_QUERY_DATABASE_MAX_CONNS: "8"
      NANO_CLICKHOUSE_ADDR: clickhouse:9000
      NANO_CLICKHOUSE_DATABASE: nano_observability
      NANO_CLICKHOUSE_USER: nano_observability
      NANO_CLICKHOUSE_PASSWORD: nano-observability
      NANO_COLLECTOR_PRODUCER_ID: nano-worker
      NANO_REPLAY_STAGING_S3_ENDPOINT: minio:9000
      NANO_REPLAY_STAGING_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_STAGING_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_STAGING_S3_BUCKET: nano-agent-replay-staging
      NANO_REPLAY_S3_ENDPOINT: minio:9000
      NANO_REPLAY_S3_ACCESS_KEY_ID: nano
      NANO_REPLAY_S3_SECRET_ACCESS_KEY: nano-password
      NANO_REPLAY_S3_BUCKET: nano-agent-replay
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "127.0.0.1:58082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/internal/agent-observability/v1/health >/dev/null && wget -qO- http://127.0.0.1:9093/metrics >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nano
      MINIO_ROOT_PASSWORD: nano-password
    ports:
      - "59000:9000"
      - "59001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 nano nano-password
        mc mb --ignore-existing local/nano-agent-replay-staging
        mc mb --ignore-existing local/nano-agent-replay
        mc mb --ignore-existing local/nano-sources

  qdrant:
    image: qdrant/qdrant:v1.15.1
    ports:
      - "56333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - qdrant-data:/qdrant/storage

  bifrost:
    image: maximhq/bifrost:v1.6.3
    env_file:
      - path: .env
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "56666"
      LOG_LEVEL: info
      LOG_STYLE: json
    ports:
      - "56666:56666"
    volumes:
      - ../bifrost:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:56666 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  document-renderer:
    build:
      context: ../..
      dockerfile: infra/document-renderer/Dockerfile
    environment:
      NANO_DOCUMENT_RENDERER_ADDR: ":8084"
      NANO_DOCUMENT_RENDERER_SERVICE_TOKEN: nano-local-renderer-token
      NANO_DOCUMENT_RENDER_CONFIG_ID: pdfium-libreoffice-v1
      NANO_DOCUMENT_RENDERER_MAX_CONCURRENT: "2"
    ports:
      - "127.0.0.1:8084:8084"
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8084/health/live >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 20

  web-reader:
    build:
      context: ../..
      dockerfile: infra/web-reader/Dockerfile
    environment:
      NANO_WEB_READER_ADDR: ":8085"
      NANO_WEB_READER_SERVICE_TOKEN: nano-local-reader-token
      NANO_WEB_READER_ENGINE: "auto"
      # OrbStack/Clash fake-IP DNS maps public hostnames into narrow synthetic
      # ranges. IP-literal and ordinary private destinations stay blocked.
      NANO_WEB_READER_ALLOW_SYNTHETIC_PROXY_TARGETS: "true"
      NANO_WEB_READER_MAX_CONCURRENT: "4"
      NANO_WEB_READER_BROWSER_MAX_CONCURRENT: "2"
      NANO_WEB_READER_BROWSER_EXECUTABLE: /usr/bin/chromium
    ports:
      - "127.0.0.1:8085:8085"
    read_only: true
    tmpfs:
      # Chromium keeps its profile and cache under HOME=/tmp.
      - /tmp:size=536870912,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Chromium spawns a browser + renderer + utility process cluster, so the
    # sidecar needs a higher pid ceiling than the Go sidecars.
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8085/health/live').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "54317:4317"
      - "54318:4318"
      - "51686:16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:16686 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.1.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../observability/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "59090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:11.4.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: nano
      GF_SECURITY_ADMIN_PASSWORD: nano-local-grafana
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "53000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  observability-postgres-data:
  kafka-data:
  clickhouse-data:
  minio-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
