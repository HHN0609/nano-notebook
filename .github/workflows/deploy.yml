name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Build web frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure application ECR repositories
        run: |
          repositories=(
            nano-notebook-control-plane
            nano-notebook-worker
            nano-notebook-collector
            nano-notebook-agent-trace-processor
            nano-notebook-document-renderer
            nano-notebook-web-reader
            nano-notebook-nginx
          )
          for repository in "${repositories[@]}"; do
            aws ecr describe-repositories \
              --repository-names "$repository" >/dev/null 2>&1 \
              || aws ecr create-repository \
                --repository-name "$repository" >/dev/null
          done

      - name: Build and push images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f infra/control-plane/Dockerfile \
            -t $ECR_REGISTRY/nano-notebook-control-plane:$IMAGE_TAG \
            -t $ECR_REGISTRY/nano-notebook-control-plane:latest \
            .
          docker push $ECR_REGISTRY/nano-notebook-control-plane:$IMAGE_TAG
          docker push $ECR_REGISTRY/nano-notebook-control-plane:latest

          docker build \
            -f infra/worker/Dockerfile \
            -t $ECR_REGISTRY/nano-notebook-worker:$IMAGE_TAG \
            -t $ECR_REGISTRY/nano-notebook-worker:latest \
            .
          docker push $ECR_REGISTRY/nano-notebook-worker:$IMAGE_TAG
          docker push $ECR_REGISTRY/nano-notebook-worker:latest

          docker build \
            -f infra/collector/Dockerfile \
            -t $ECR_REGISTRY/nano-notebook-collector:$IMAGE_TAG \
            -t $ECR_REGISTRY/nano-notebook-collector:latest \
            .
          docker push $ECR_REGISTRY/nano-notebook-collector:$IMAGE_TAG
          docker push $ECR_REGISTRY/nano-notebook-collector:latest

          docker build \
            -f infra/agent-trace-processor/Dockerfile \
            -t $ECR_REGISTRY/nano-notebook-agent-trace-processor:$IMAGE_TAG \
            -t $ECR_REGISTRY/nano-notebook-agent-trace-processor:latest \
            .
          docker push $ECR_REGISTRY/nano-notebook-agent-trace-processor:$IMAGE_TAG
          docker push $ECR_REGISTRY/nano-notebook-agent-trace-processor:latest

          docker build \
            -f infra/document-renderer/Dockerfile \
            -t $ECR_REGISTRY/nano-notebook-document-renderer:$IMAGE_TAG \
            -t $ECR_REGISTRY/nano-notebook-document-renderer:latest \
            .
          docker push $ECR_REGISTRY/nano-notebook-document-renderer:$IMAGE_TAG
          docker push $ECR_REGISTRY/nano-notebook-document-renderer:latest

          docker build \
            -f infra/web-reader/Dockerfile \
            -t $ECR_REGISTRY/nano-notebook-web-reader:$IMAGE_TAG \
            -t $ECR_REGISTRY/nano-notebook-web-reader:latest \
            .
          docker push $ECR_REGISTRY/nano-notebook-web-reader:$IMAGE_TAG
          docker push $ECR_REGISTRY/nano-notebook-web-reader:latest

          docker build \
            -f infra/nginx/Dockerfile \
            -t $ECR_REGISTRY/nano-notebook-nginx:$IMAGE_TAG \
            -t $ECR_REGISTRY/nano-notebook-nginx:latest \
            .
          docker push $ECR_REGISTRY/nano-notebook-nginx:$IMAGE_TAG
          docker push $ECR_REGISTRY/nano-notebook-nginx:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_AWS_REGION: ${{ secrets.AWS_REGION }}
          NANO_PUBLIC_HOST: ${{ secrets.EC2_HOST }}
          NANO_GRAFANA_ADMIN_USER: ${{ secrets.NANO_GRAFANA_ADMIN_USER }}
          NANO_GRAFANA_ADMIN_PASSWORD: ${{ secrets.NANO_GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG,DEPLOY_AWS_REGION,NANO_PUBLIC_HOST,NANO_GRAFANA_ADMIN_USER,NANO_GRAFANA_ADMIN_PASSWORD
          script: |
            set -euo pipefail
            cd /home/ubuntu/nano-notebook

            git fetch origin
            git reset --hard origin/main

            case "$NANO_PUBLIC_HOST" in
              *[!A-Za-z0-9.:-]*) echo "invalid NANO_PUBLIC_HOST" >&2; exit 1 ;;
            esac
            compose_env=infra/compose/.env
            test -f "$compose_env"
            set_env_value() {
              env_key="$1"
              env_value="$2"
              test -n "$env_value"
              if grep -q "^${env_key}=" "$compose_env"; then
                sed -i.bak "s|^${env_key}=.*$|${env_key}=${env_value}|" "$compose_env"
                rm -f "$compose_env.bak"
              else
                printf '\n%s=%s\n' "$env_key" "$env_value" >> "$compose_env"
              fi
            }
            set_env_value NANO_PUBLIC_HOST "$NANO_PUBLIC_HOST"
            set_env_value NANO_GRAFANA_ADMIN_USER "$NANO_GRAFANA_ADMIN_USER"
            set_env_value NANO_GRAFANA_ADMIN_PASSWORD "$NANO_GRAFANA_ADMIN_PASSWORD"

            aws ecr get-login-password --region "$DEPLOY_AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            docker compose --env-file "$compose_env" -f infra/compose/compose.prod.yaml config --quiet
            docker compose --env-file "$compose_env" -f infra/compose/compose.prod.yaml pull
            if ! docker compose --env-file "$compose_env" -f infra/compose/compose.prod.yaml up -d --remove-orphans --wait --wait-timeout 300; then
              docker compose --env-file "$compose_env" -f infra/compose/compose.prod.yaml ps || true
              docker compose --env-file "$compose_env" -f infra/compose/compose.prod.yaml logs --no-color --tail=200 control-plane || true
              exit 1
            fi

            curl --fail --silent --show-error http://127.0.0.1/health/ready >/dev/null
            curl --fail --silent --show-error http://127.0.0.1/version >/dev/null
            docker compose --env-file "$compose_env" -f infra/compose/compose.prod.yaml ps

            docker image prune -af --filter "until=24h"
